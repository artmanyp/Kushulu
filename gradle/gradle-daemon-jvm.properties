# Gradle Daemon JVM criteria: which JDK Gradle itself runs on.
# Android Studio 2026.2.2 bundles JetBrains Runtime (JBR) 25, which
# satisfies this, so sync works with no per-machine Gradle JDK setting (no
# .idea/gradle.xml, no .gradle/config.properties, no #GRADLE_LOCAL_JAVA_HOME).
# From a terminal, run ./gradlew with a JDK 25 (e.g. Studio's jbr folder) on JAVA_HOME.
# This is the JDK that RUNS Gradle; the app still compiles to Java 17 (see app/build.gradle).
toolchainVersion=25
