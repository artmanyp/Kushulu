name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only used to attach APKs to a GitHub Release when you push a v* tag

    steps:
      - uses: actions/checkout@v5

      # Single source of truth: the same files Android Studio uses
      - name: Read Gradle and JDK versions from the project
        id: tools
        run: |
          echo "gradle=$(sed -n 's/.*gradle-\([0-9][0-9.]*\)-bin\.zip.*/\1/p' gradle/wrapper/gradle-wrapper.properties)" >> "$GITHUB_OUTPUT"
          echo "jdk=$(sed -n 's/^toolchainVersion=//p' gradle/gradle-daemon-jvm.properties)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.tools.outputs.jdk }}

      # Accepts the SDK licences. The action's default package list contains the retired
      # 'tools' package, which makes sdkmanager fail, so ask for platform-tools only.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ steps.tools.outputs.gradle }}

      # Optional: sign the release APK when the KEYSTORE_* secrets exist
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          fi

      - name: Show environment
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la gradle gradle/wrapper || true
          if [ -x ./gradlew ]; then ./gradlew --version; else gradle --version; fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          TASKS="assembleDebug"
          if [ "$SIGNED" = "true" ]; then TASKS="$TASKS assembleRelease"; fi
          if [ -x ./gradlew ]; then ./gradlew $TASKS --stacktrace; else gradle $TASKS --stacktrace; fi

      - name: Collect APKs
        run: |
          mkdir dist
          cp app/build/outputs/apk/debug/*.apk dist/Kushulu-debug.apk
          if [ "$SIGNED" = "true" ]; then cp app/build/outputs/apk/release/*.apk dist/Kushulu-release.apk; fi

      - uses: actions/upload-artifact@v5
        with:
          name: Kushulu-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APKs to the GitHub Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
